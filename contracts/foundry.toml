[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
fs_permissions = [
    { access = "read-write", path = "./deployments" },
    { access = "read-write", path = "./fixtures" },
]

remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]

[profile.default.fuzz]
runs = 512

[profile.ci.fuzz]
runs = 5000

[rpc_endpoints]
monad_testnet = "${MONAD_RPC_URL}"

[etherscan]
monad_testnet = { key = "${MONAD_EXPLORER_API_KEY}", url = "${MONAD_EXPLORER_API_URL}", chain = 10143 }

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"

[invariant]
runs = 64
depth = 200
fail_on_revert = false
call_override = false
